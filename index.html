<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNP インベーダー v0.2.13</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    #gameCanvas {
      background-color: #000;
      border: 1px solid #333;
      width: 360px;
      height: 640px;
      display: block;
      outline: none; /* フォーカス時の枠線を非表示 */
    }
    
    #gameCanvas:focus {
      border: 1px solid #555; /* フォーカス時の視覚的フィードバック */
    }
    
    .version-info {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #999;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="360" height="640" tabindex="0"></canvas>
  </div>
  
  <div class="version-info">v0.2.13</div>
  
  <!-- ゲームのメインスクリプト -->
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
